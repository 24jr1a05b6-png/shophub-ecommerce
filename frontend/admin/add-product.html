<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add / Edit Product | ShopHub Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <header id="site-navbar"></header>

  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <main class="admin-main">
      <div class="admin-header">
        <h1 class="page-title" id="formTitle">Add Product</h1>
        <p class="text-muted" id="formSubtitle">Fill in the details to create a new product.</p>
      </div>

      <form class="card" id="productForm" style="max-width:760px" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">Product Name</label>
          <input type="text" name="name" id="name" class="form-control"
                 placeholder="e.g. Wireless Headphones" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="description">Description</label>
          <textarea name="description" id="description" class="form-control"
                    placeholder="Describe the product..." required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="price">Price ($)</label>
            <input type="number" step="0.01" min="0" name="price" id="price"
                   class="form-control" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="category">Category</label>
            <select name="category" id="category" class="form-control" required></select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="image">Image URL</label>
          <input type="url" name="image" id="image" class="form-control"
                 placeholder="https://..." />
          <span class="form-hint">Leave blank to use a placeholder image.</span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="stock">Stock Quantity</label>
            <input type="number" min="0" name="stock" id="stock"
                   class="form-control" value="0" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="rating">Rating (0–5)</label>
            <input type="number" step="0.1" min="0" max="5" name="rating" id="rating"
                   class="form-control" value="0" />
          </div>
        </div>

        <div class="form-group">
          <label class="flex gap-1" style="align-items:center;cursor:pointer">
            <input type="checkbox" name="featured" id="featured" />
            <span>Mark as Featured Product</span>
          </label>
        </div>

        <div class="flex gap-2 mt-2">
          <button type="submit" class="btn btn-primary">💾 Save Product</button>
          <a href="products.html" class="btn btn-light">Cancel</a>
        </div>
      </form>
    </main>
  </div>

  <footer id="site-footer"></footer>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/admin.js"></script>
  <script>document.addEventListener('DOMContentLoaded', initAdminProductForm);</script>
</body>
</html>
