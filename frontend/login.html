<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | ShopHub</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header id="site-navbar"></header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">🛍️ ShopHub</div>
      <h2>Welcome back 👋</h2>
      <p class="text-muted mb-3">Login to your account to continue shopping.</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" name="email" id="email" class="form-control"
                 placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" name="password" id="password" class="form-control"
                 placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <div class="form-error" id="loginError"></div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
      </form>

      <p class="text-center mt-3">
        Don't have an account? <a href="register.html" class="text-primary" style="font-weight:600">Register</a>
      </p>

      <div class="alert alert-info mt-3" style="font-size:.82rem;display:block">
        <strong>Demo accounts</strong><br />
        Admin: <code>admin@shop.com</code> / <code>admin123</code><br />
        Customer: <code>user@shop.com</code> / <code>user123</code>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
