<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products | ShopHub</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header id="site-navbar"></header>

  <main style="flex:1">
    <div class="container" style="padding-top:32px">
      <h1 class="page-title">All Products</h1>
      <p class="text-muted mb-3" id="resultCount">Loading products...</p>

      <!-- Search / filters -->
      <form class="toolbar" id="filterForm">
        <div class="form-group" style="flex:2">
          <label class="form-label" for="filterSearch">Search</label>
          <input type="text" id="filterSearch" class="form-control" placeholder="Search products..." />
        </div>
        <div class="form-group">
          <label class="form-label" for="filterCategory">Category</label>
          <select id="filterCategory" class="form-control"></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="filterMin">Min Price</label>
          <input type="number" id="filterMin" class="form-control" min="0" placeholder="$0" />
        </div>
        <div class="form-group">
          <label class="form-label" for="filterMax">Max Price</label>
          <input type="number" id="filterMax" class="form-control" min="0" placeholder="$1000" />
        </div>
        <div class="form-group">
          <label class="form-label" for="filterSort">Sort By</label>
          <select id="filterSort" class="form-control">
            <option value="newest">Newest</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="rating">Top Rated</option>
            <option value="name">Name (A–Z)</option>
          </select>
        </div>
        <div class="form-group" style="flex:0">
          <button type="submit" class="btn btn-primary">Apply</button>
        </div>
        <div class="form-group" style="flex:0">
          <button type="reset" class="btn btn-light">Reset</button>
        </div>
      </form>

      <div class="product-grid" id="productGrid">
        <div class="loader-wrap" style="grid-column:1/-1"><span class="loader"></span></div>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
