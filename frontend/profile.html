<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile | ShopHub</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header id="site-navbar"></header>

  <main style="flex:1">
    <div class="container" style="padding-top:32px;max-width:760px">
      <h1 class="page-title mb-3">My Profile</h1>

      <div class="card mb-3">
        <div class="flex gap-2" style="align-items:center;flex-wrap:wrap">
          <span class="nav-avatar" style="width:56px;height:56px;font-size:1.4rem">👤</span>
          <div>
            <div class="flex gap-1" style="align-items:center">
              <strong id="profileRole" style="font-size:1.05rem"></strong>
            </div>
            <div class="text-muted" style="font-size:.88rem">
              Member since <span id="profileJoined">—</span>
            </div>
          </div>
        </div>
      </div>

      <form class="card" id="profileForm" novalidate>
        <h3 class="mb-2">Account Details</h3>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" name="name" id="name" class="form-control" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email (cannot be changed)</label>
            <input type="email" name="email" id="email" class="form-control" disabled />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input type="tel" name="phone" id="phone" class="form-control" />
        </div>

        <h3 class="mb-2 mt-2">Default Address</h3>
        <div class="form-group">
          <label class="form-label" for="street">Street Address</label>
          <input type="text" name="street" id="street" class="form-control" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="city">City</label>
            <input type="text" name="city" id="city" class="form-control" />
          </div>
          <div class="form-group">
            <label class="form-label" for="state">State</label>
            <input type="text" name="state" id="state" class="form-control" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="pincode">Pincode</label>
            <input type="text" name="pincode" id="pincode" class="form-control" />
          </div>
          <div class="form-group">
            <label class="form-label" for="country">Country</label>
            <input type="text" name="country" id="country" class="form-control" />
          </div>
        </div>

        <h3 class="mb-2 mt-2">Change Password</h3>
        <div class="form-group">
          <label class="form-label" for="password">New Password</label>
          <input type="password" name="password" id="password" class="form-control"
                 placeholder="Leave blank to keep current password" minlength="6" />
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
