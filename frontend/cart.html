<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart | ShopHub</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header id="site-navbar"></header>

  <main style="flex:1">
    <div class="container" style="padding-top:32px">
      <h1 class="page-title mb-3">Shopping Cart</h1>

      <div class="cart-layout">
        <div class="card" id="cartItems">
          <div class="loader-wrap"><span class="loader"></span></div>
        </div>
        <div class="summary-card" id="cartSummary"></div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
