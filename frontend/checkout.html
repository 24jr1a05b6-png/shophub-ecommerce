<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | ShopHub</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header id="site-navbar"></header>

  <main style="flex:1">
    <div class="container" style="padding-top:32px" id="checkoutContainer">
      <h1 class="page-title mb-3">Checkout</h1>

      <div class="cart-layout">
        <form class="card" id="checkoutForm" novalidate>
          <h3 class="mb-2">Customer Information</h3>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="fullName">Full Name</label>
              <input type="text" name="fullName" id="fullName" class="form-control" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="email">Email</label>
              <input type="email" name="email" id="email" class="form-control" required />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" name="phone" id="phone" class="form-control"
                   placeholder="e.g. 9876543210" required />
          </div>

          <h3 class="mb-2 mt-3">Delivery Information</h3>
          <div class="form-group">
            <label class="form-label" for="address">Address</label>
            <input type="text" name="address" id="address" class="form-control"
                   placeholder="House no, street" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="city">City</label>
              <input type="text" name="city" id="city" class="form-control" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="state">State</label>
              <input type="text" name="state" id="state" class="form-control" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="pincode">Pincode</label>
              <input type="text" name="pincode" id="pincode" class="form-control" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="country">Country</label>
              <input type="text" name="country" id="country" class="form-control"
                     placeholder="India" required />
            </div>
          </div>

          <h3 class="mb-2 mt-3">Payment Method</h3>
          <div class="alert alert-info">
            💵 <strong>Cash on Delivery</strong> — Pay when your order arrives.
            (Online payment can be added later.)
          </div>

          <div class="form-error" id="checkoutError"></div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Place Order</button>
        </form>

        <div class="summary-card" id="checkoutSummary">
          <div class="loader-wrap"><span class="loader"></span></div>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
