<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | ShopHub</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header id="site-navbar"></header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">🛍️ ShopHub</div>
      <h2>Create your account</h2>
      <p class="text-muted mb-3">Join ShopHub and start shopping in seconds.</p>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" name="name" id="name" class="form-control"
                 placeholder="John Doe" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" name="email" id="email" class="form-control"
                 placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" name="password" id="password" class="form-control"
                   placeholder="Min 6 characters" required minlength="6" autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" name="confirmPassword" id="confirmPassword" class="form-control"
                   placeholder="Repeat password" required autocomplete="new-password" />
          </div>
        </div>

        <div class="form-error" id="registerError"></div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
      </form>

      <p class="text-center mt-3">
        Already have an account? <a href="login.html" class="text-primary" style="font-weight:600">Login</a>
      </p>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
